name: dungeon
version: '0.1.0'
main: net.chikina.minecraft.dungeon.Dungeon
api-version: '1.21'
softdepend: [ProtocolLib]
commands:
  spawnshop:
    description: Spawns the Pickaxe Shop NPC
    permission: dungeon.spawnshop
    permission-message: You do not have permission to use this command.
  spawnforge:
    description: Spawns the Forge Shop NPC
    permission: dungeon.spawnforge
    permission-message: You do not have permission to use this command.
  spawnwandshop:
    description: Spawns the Wand Shop NPC
    permission: dungeon.spawnwandshop
    permission-message: You do not have permission to use this command.
  spawnenemy:
    description: Spawns a dungeon enemy
    permission: dungeon.spawnenemy
    permission-message: You do not have permission to use this command.
  clearspawns:
    description: Clears all enemy spawn points and despawns enemies
    permission: dungeon.admin
    permission-message: You do not have permission to use this command.
  killenemies:
    description: Despawns all active dungeon enemies (keeps spawn points)
    permission: dungeon.admin
    permission-message: You do not have permission to use this command.
  spawndummy:
    description: Spawns a high-HP dummy enemy for testing
    permission: dungeon.admin
    permission-message: You do not have permission to use this command.
  gethook:
    description: Gives the player a Grappling Hook
    permission: dungeon.admin
    permission-message: You do not have permission to use this command.
  spawnboss:
    description: Spawns the Starfall Cleric boss
    permission: dungeon.admin
    permission-message: You do not have permission to use this command.